name: zunia_sdk
description: >-
  Connect Flutter apps to the Zunia wallet: QR pairing and deep links over
  zunia.connect.v2, end-to-end encrypted, with Cosmos signing and sign-in.
version: 0.1.1
homepage: https://zunialab.com
repository: https://github.com/Zunia-Lab/zunia-sdk/tree/main/flutter/zunia_sdk
issue_tracker: https://github.com/Zunia-Lab/zunia-sdk/issues
documentation: https://docs.zunialab.com/docs/integrate/flutter
topics:
  - wallet
  - cosmos
  - blockchain
  - qr-code
  - deep-linking

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  crypto: ^3.0.3
  cryptography: ^2.7.0
  flutter:
    sdk: flutter
  http: ^1.2.0
  meta: ^1.15.0
  qr: ^3.0.2
  url_launcher: ^6.3.0
  web_socket_channel: ^3.0.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
