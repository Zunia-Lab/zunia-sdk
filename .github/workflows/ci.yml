name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # 22, matching release.yml. @zunialab/interchain's test script passes a glob to
          # `node --test`, which node 20 does not expand -- it reports the pattern as a
          # missing file and the whole suite silently fails to run.
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build first: the web and react tests import their dependencies' dist output.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - name: Lint the packed packages (publint, attw)
        run: pnpm check:packages
      - name: Install the tarballs in a Node script and a Vite app
        run: pnpm smoke:tarballs
