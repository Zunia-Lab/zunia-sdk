name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # Required for npm provenance. Without this the publish still succeeds but ships no
  # attestation, so consumers cannot verify where the tarball was built.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # sdk-core, sdk-web and sdk-react share one version (see .changeset/config.json).
      - name: Check the tag matches the package versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for pkg in core web react; do
            version=$(node -p "require('./packages/$pkg/package.json').version")
            if [ "$version" != "$tag" ]; then
              echo "packages/$pkg is at $version but the tag is v$tag"
              exit 1
            fi
          done

      - name: Verify before publishing
        run: |
          pnpm build
          pnpm typecheck
          pnpm test
          pnpm check:packages
          pnpm smoke:tarballs

      # pnpm, not npm: only pnpm rewrites the `workspace:*` ranges in sdk-web and
      # sdk-react into real versions. `npm publish` would ship the literal protocol and
      # every install would fail.
      #
      # --no-git-checks is required because a tag push leaves HEAD detached, which pnpm
      # otherwise rejects as not being on the publish branch.
      - name: Publish to npm
        run: pnpm -r publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
